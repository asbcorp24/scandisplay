name: Verify optimized video client

on:
  push:
    branches: [main]
    paths:
      - .github/verify-video-trigger.txt

permissions:
  contents: write

jobs:
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure
        run: cmake -S client -B client/build -A x64
      - name: Build
        run: cmake --build client/build --config Release --parallel

  cleanup:
    needs: windows-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove verification files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-video-build.yml .github/verify-video-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete optimized video build verification"
          git push origin main
