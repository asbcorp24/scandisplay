name: Verify local administrator authentication

on:
  push:
    branches: [main]
    paths:
      - .github/verify-admin-auth-trigger.txt

permissions:
  contents: write

jobs:
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure
        run: cmake -S client -B client/build -A x64
      - name: Build
        run: cmake --build client/build --config Release --parallel

  cleanup:
    needs: windows-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary admin authentication files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/add-local-admin-auth.yml
          rm -f .github/add-admin-auth-trigger.txt
          rm -f tools/add_admin_auth.py
          rm -f .github/workflows/apply-admin-auth-v2.yml
          rm -f .github/add-admin-auth-trigger-v2.txt
          rm -f .github/workflows/verify-admin-auth-build.yml
          rm -f .github/verify-admin-auth-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete local administrator authentication"
          git push origin main
