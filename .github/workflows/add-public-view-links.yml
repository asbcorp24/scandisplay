name: Integrate public video viewing

on:
  push:
    branches: [main]
    paths:
      - .github/public-view-trigger.txt

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add public links and playback speed to admin archive
        shell: python
        run: |
          from pathlib import Path

          index = Path('server/index.php')
          text = index.read_text(encoding='utf-8')

          login_marker = '''                <button class="btn btn-primary w-100">Войти</button>
            </form>'''
          login_replacement = '''                <button class="btn btn-primary w-100">Войти</button>
            </form>
            <a class="btn btn-outline-secondary w-100 mt-3" href="public.php">Открыть публичный архив</a>'''
          if login_marker in text and 'Открыть публичный архив' not in text:
              text = text.replace(login_marker, login_replacement, 1)

          nav_marker = '''                <li class="nav-item"><a class="nav-link <?= $page === 'recordings' ? 'active' : '' ?>" href="?page=recordings">Видеозаписи</a></li>'''
          nav_replacement = nav_marker + '''
                <li class="nav-item"><a class="nav-link" href="public.php" target="_blank" rel="noopener">Публичный просмотр</a></li>'''
          if nav_marker in text and 'target="_blank" rel="noopener">Публичный просмотр' not in text:
              text = text.replace(nav_marker, nav_replacement, 1)

          video_marker = '''                        <video controls preload="metadata" src="stream.php?id=<?= (int) $record['id'] ?>"></video>'''
          video_replacement = '''                        <video class="admin-video" controls preload="metadata" playsinline src="stream.php?id=<?= (int) $record['id'] ?>"></video>
                        <div class="bg-white border-bottom px-3 py-2 d-flex align-items-center justify-content-end gap-2">
                            <label class="small text-secondary mb-0">Скорость:</label>
                            <select class="form-select form-select-sm admin-playback-speed" style="width:auto;min-width:100px">
                                <option value="0.5">0,5×</option>
                                <option value="0.75">0,75×</option>
                                <option value="1" selected>1×</option>
                                <option value="1.25">1,25×</option>
                                <option value="1.5">1,5×</option>
                                <option value="2">2×</option>
                                <option value="3">3×</option>
                                <option value="4">4×</option>
                            </select>
                        </div>'''
          if video_marker in text and 'admin-playback-speed' not in text:
              text = text.replace(video_marker, video_replacement, 1)

          script_marker = '''<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>'''
          speed_script = '''<script>
          document.querySelectorAll('.recording-card').forEach((card) => {
              const video = card.querySelector('.admin-video');
              const speed = card.querySelector('.admin-playback-speed');
              if (!video || !speed) return;
              speed.addEventListener('change', () => {
                  const rate = Number(speed.value) || 1;
                  video.defaultPlaybackRate = rate;
                  video.playbackRate = rate;
              });
              video.addEventListener('play', () => {
                  document.querySelectorAll('.admin-video').forEach((other) => {
                      if (other !== video) other.pause();
                  });
              });
          });
          </script>
          ''' + script_marker
          if script_marker in text and "document.querySelectorAll('.recording-card')" not in text:
              text = text.replace(script_marker, speed_script, 1)

          index.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          docs = readme.read_text(encoding='utf-8')
          section = r'''

---

# Публичный просмотр видеозаписей

Открытая страница архива доступна без логина администратора:

```text
http://127.0.0.1/scandisplay/server/public.php
```

На странице доступны фильтры по названию, группе и датам. Для каждого видео можно выбрать скорость `0,5×`, `0,75×`, `1×`, `1,25×`, `1,5×`, `2×`, `3×` или `4×`, а также перематывать запись на 10 секунд назад или вперёд. Одновременно воспроизводится только одно видео.

Публичный поток поддерживает HTTP Range, поэтому браузер может перематывать длинные MP4 без предварительной загрузки всего файла. Цифровой код студента, служебный путь к файлу и имя компьютера на публичной странице не отображаются.

Публичный просмотр включён по умолчанию. Для его отключения задайте переменную окружения:

```text
SCANDISPLAY_PUBLIC_VIEW=0
```

После изменения переменной перезапустите Apache или PHP-сервер.
'''
          if '# Публичный просмотр видеозаписей' not in docs:
              readme.write_text(docs.rstrip() + section + '\n', encoding='utf-8')

      - name: Lint PHP
        run: |
          php -l server/public.php
          php -l server/public_stream.php
          php -l server/config.php
          php -l server/index.php

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.php README.md
          if ! git diff --cached --quiet; then
            git commit -m "Link public video gallery and add playback speed controls"
            git push origin main
          fi

  cleanup:
    needs: integrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time integration files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/add-public-view-links.yml .github/public-view-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete public video viewing integration"
          git push origin main
