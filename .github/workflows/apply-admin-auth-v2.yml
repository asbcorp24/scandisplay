name: Apply local administrator authentication v2

on:
  push:
    branches: [main]
    paths:
      - .github/add-admin-auth-trigger-v2.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python tools/add_admin_auth.py
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/main.cpp client/CMakeLists.txt README.md
          git commit -m "Add local administrator login"
          git push origin main
