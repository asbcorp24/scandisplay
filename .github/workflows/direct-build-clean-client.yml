name: Direct clean client release build

on:
  push:
    branches: [main]
    paths:
      - .github/direct-build-clean-client-trigger.txt

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure client
        run: cmake -S client -B client/build -A x64

      - name: Build release
        run: cmake --build client/build --config Release

      - name: Publish executable and clean temporary automation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item client/build/Release/ScanDisplay.exe release/ScanDisplay.exe -Force

          $temporaryFiles = @(
            '.github/direct-build-clean-client-trigger.txt',
            '.github/workflows/direct-build-clean-client.yml',
            '.github/remove-client-admin-trigger.txt',
            '.github/remove-client-admin-and-autoconfig.py',
            '.github/workflows/remove-client-admin-and-build.yml'
          )
          foreach ($file in $temporaryFiles) {
            if (Test-Path $file) { Remove-Item $file -Force }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f release/ScanDisplay.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish client without local administrator"
            git push origin main
          }
