name: Finalize capture interval documentation

on:
  push:
    branches: [main]
    paths:
      - .github/capture-interval-trigger.txt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Finish README and remove temporary files
        shell: python
        run: |
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'Expected README fragment not found: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'Пока изменения находятся в отдельной ветке, переключитесь на неё:\n\n'
              '```powershell\n'
              'git checkout feature/initial-mvp\n'
              '```\n\n'
              'После слияния pull request с веткой `main` эта команда не потребуется.\n\n',
              ''
          )

          replace_once(
              '`output_dir` — каталог локального хранения MP4:\n\n'
              '```ini\n'
              'output_dir=%LOCALAPPDATA%\\ScanDisplay\\recordings\n'
              '```\n\n'
              '`delete_after_upload`:',
              '`output_dir` — каталог локального хранения MP4:\n\n'
              '```ini\n'
              'output_dir=%LOCALAPPDATA%\\ScanDisplay\\recordings\n'
              '```\n\n'
              '`capture_interval_seconds` — интервал между снимками экрана в секундах:\n\n'
              '```ini\n'
              'capture_interval_seconds=30\n'
              '```\n\n'
              '- значение по умолчанию — `30`, то есть один кадр каждые 30 секунд;\n'
              '- минимальное значение — `1`, то есть один кадр в секунду;\n'
              '- `0` и отрицательные значения автоматически заменяются на `1`;\n'
              '- текстовое или некорректное значение заменяется на значение по умолчанию `30`;\n'
              '- после изменения параметра программу необходимо перезапустить.\n\n'
              '`delete_after_upload`:'
          )

          replace_once(
              '4. Программа будет получать один новый кадр всего виртуального рабочего стола каждую секунду.',
              '4. Программа будет получать новый кадр всего виртуального рабочего стола через интервал `capture_interval_seconds` из `config.ini`. По умолчанию — один кадр каждые 30 секунд.'
          )

          replace_once(
              'sudo git checkout feature/initial-mvp\n',
              ''
          )

          replace_once(
              'Клиент получает один новый кадр в секунду. Для совместимости с браузерными проигрывателями FFmpeg создаёт стандартный видеопоток 25 кадров/с, повторяя текущий кадр до появления следующего снимка.\n\n'
              'Фактическая частота наблюдения остаётся:\n\n'
              '```text\n'
              '1 кадр в секунду\n'
              '```',
              'Клиент получает новый кадр через интервал `capture_interval_seconds`. По умолчанию это один кадр каждые 30 секунд, минимальный интервал — одна секунда.\n\n'
              'Для совместимости с браузерными проигрывателями FFmpeg создаёт стандартный видеопоток 25 кадров/с и повторяет последний снимок до появления следующего. Временная шкала MP4 учитывает выбранный интервал, поэтому длительность видео соответствует реальной длительности записи.'
          )

          readme.write_text(text, encoding='utf-8')

          Path('.github/capture-interval-trigger.txt').unlink()
          Path('.github/workflows/capture-interval-patch.yml').unlink()

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document capture interval setting"
          git push origin main
