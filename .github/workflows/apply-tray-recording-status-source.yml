name: Apply tray recording status source

on:
  push:
    branches: [main]
    paths:
      - .github/apply-tray-recording-status-source-trigger.txt

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply tray tooltip source changes
        run: python .github/add-tray-recording-status.py

      - name: Commit source changes
        run: |
          rm -f .github/apply-tray-recording-status-source-trigger.txt
          rm -f .github/workflows/apply-tray-recording-status-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/main.cpp README.md
          git add -u .github
          git commit -m "Show recording time and file size in tray"
          git push origin main
