name: Add recording titles

on:
  push:
    branches: [main]
    paths:
      - .github/recording-title-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Implement recording titles
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Expected fragment not found ({label}): {old[:180]!r}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Windows client
          # ------------------------------------------------------------------
          main_path = Path('client/src/main.cpp')
          source = main_path.read_text(encoding='utf-8')

          source = replace_once(source,
              'constexpr wchar_t kMainWindowClass[] = L"ScanDisplayMainWindow";\n'
              'constexpr wchar_t kAuthWindowClass[] = L"ScanDisplayAuthWindow";',
              'constexpr wchar_t kMainWindowClass[] = L"ScanDisplayMainWindow";\n'
              'constexpr wchar_t kAuthWindowClass[] = L"ScanDisplayAuthWindow";\n'
              'constexpr wchar_t kRecordingTitleWindowClass[] = L"ScanDisplayRecordingTitleWindow";',
              'window classes')

          source = replace_once(source,
              'constexpr UINT kAuthEditId = 2001;\n'
              'constexpr UINT kAuthButtonId = 2002;',
              'constexpr UINT kAuthEditId = 2001;\n'
              'constexpr UINT kAuthButtonId = 2002;\n'
              'constexpr UINT kRecordingTitleEditId = 2101;\n'
              'constexpr UINT kRecordingTitleButtonId = 2102;',
              'control ids')

          source = replace_once(source,
              'HWND g_authWindow = nullptr;\n'
              'HWND g_authEdit = nullptr;\n'
              'HWND g_authStatus = nullptr;',
              'HWND g_authWindow = nullptr;\n'
              'HWND g_authEdit = nullptr;\n'
              'HWND g_authStatus = nullptr;\n'
              'HWND g_recordingTitleWindow = nullptr;\n'
              'HWND g_recordingTitleEdit = nullptr;\n'
              'HWND g_recordingTitleStatus = nullptr;',
              'title window globals')

          source = replace_once(source,
              'fs::path g_outputFile;\n'
              'std::wstring g_startedAt;',
              'fs::path g_outputFile;\n'
              'std::wstring g_startedAt;\n'
              'std::wstring g_recordingTitle;',
              'recording title global')

          source = replace_once(source,
              'std::wstring ModuleDirectory() {\n'
              '    std::vector<wchar_t> buffer(32768);\n'
              '    const DWORD length = GetModuleFileNameW(nullptr, buffer.data(), static_cast<DWORD>(buffer.size()));\n'
              '    return fs::path(std::wstring(buffer.data(), length)).parent_path().wstring();\n'
              '}\n',
              'std::wstring ModuleDirectory() {\n'
              '    std::vector<wchar_t> buffer(32768);\n'
              '    const DWORD length = GetModuleFileNameW(nullptr, buffer.data(), static_cast<DWORD>(buffer.size()));\n'
              '    return fs::path(std::wstring(buffer.data(), length)).parent_path().wstring();\n'
              '}\n\n'
              'std::wstring TrimText(const std::wstring& value) {\n'
              '    const size_t first = value.find_first_not_of(L" \\t\\r\\n");\n'
              '    if (first == std::wstring::npos) return {};\n'
              '    const size_t last = value.find_last_not_of(L" \\t\\r\\n");\n'
              '    return value.substr(first, last - first + 1);\n'
              '}\n',
              'trim helper')

          source = replace_once(source,
              'void CaptureLoop(StudentSession student) {',
              'void CaptureLoop(StudentSession student, std::wstring recordingTitle) {',
              'capture signature')

          source = replace_once(source,
              '        const int boxHeight = fontHeight * 2 + 28;\n'
              '        RECT box{12, 12, g_screenWidth - 12, 12 + boxHeight};\n'
              '        HBRUSH background = CreateSolidBrush(RGB(0, 0, 0));\n'
              '        FillRect(memory, &box, background);\n'
              '        DeleteObject(background);\n\n'
              '        SetBkMode(memory, TRANSPARENT);\n'
              '        SetTextColor(memory, RGB(255, 255, 255));\n'
              '        const std::wstring line1 = L"Группа: " + student.groupName + L"    Студент: " + student.fullName();\n'
              '        const std::wstring line2 = L"Время: " + TimestampOverlay();\n'
              '        RECT text1{26, 16, g_screenWidth - 24, 18 + fontHeight + 8};\n'
              '        RECT text2{26, 20 + fontHeight, g_screenWidth - 24, 22 + fontHeight * 2 + 8};\n'
              '        DrawTextW(memory, line1.c_str(), -1, &text1, DT_LEFT | DT_SINGLELINE | DT_END_ELLIPSIS | DT_VCENTER);\n'
              '        DrawTextW(memory, line2.c_str(), -1, &text2, DT_LEFT | DT_SINGLELINE | DT_END_ELLIPSIS | DT_VCENTER);',
              '        const int boxHeight = fontHeight * 3 + 36;\n'
              '        RECT box{12, 12, g_screenWidth - 12, 12 + boxHeight};\n'
              '        HBRUSH background = CreateSolidBrush(RGB(0, 0, 0));\n'
              '        FillRect(memory, &box, background);\n'
              '        DeleteObject(background);\n\n'
              '        SetBkMode(memory, TRANSPARENT);\n'
              '        SetTextColor(memory, RGB(255, 255, 255));\n'
              '        const std::wstring line1 = L"Название: " + recordingTitle;\n'
              '        const std::wstring line2 = L"Группа: " + student.groupName + L"    Студент: " + student.fullName();\n'
              '        const std::wstring line3 = L"Время: " + TimestampOverlay();\n'
              '        RECT text1{26, 16, g_screenWidth - 24, 18 + fontHeight + 8};\n'
              '        RECT text2{26, 20 + fontHeight, g_screenWidth - 24, 22 + fontHeight * 2 + 8};\n'
              '        RECT text3{26, 24 + fontHeight * 2, g_screenWidth - 24, 26 + fontHeight * 3 + 8};\n'
              '        DrawTextW(memory, line1.c_str(), -1, &text1, DT_LEFT | DT_SINGLELINE | DT_END_ELLIPSIS | DT_VCENTER);\n'
              '        DrawTextW(memory, line2.c_str(), -1, &text2, DT_LEFT | DT_SINGLELINE | DT_END_ELLIPSIS | DT_VCENTER);\n'
              '        DrawTextW(memory, line3.c_str(), -1, &text3, DT_LEFT | DT_SINGLELINE | DT_END_ELLIPSIS | DT_VCENTER);',
              'overlay title')

          source = replace_once(source,
              'bool UploadVideo(const fs::path& file, const std::wstring& startedAt, const std::wstring& endedAt,\n'
              '                 const StudentSession& student, std::wstring& error) {',
              'bool UploadVideo(const fs::path& file, const std::wstring& startedAt, const std::wstring& endedAt,\n'
              '                 const std::wstring& recordingTitle, const StudentSession& student, std::wstring& error) {',
              'upload signature')

          source = replace_once(source,
              '    prefix += field("started_at", startedAt);\n'
              '    prefix += field("ended_at", endedAt);\n'
              '    prefix += field("computer_name", ComputerName());',
              '    prefix += field("title", recordingTitle);\n'
              '    prefix += field("started_at", startedAt);\n'
              '    prefix += field("ended_at", endedAt);\n'
              '    prefix += field("computer_name", ComputerName());',
              'upload title field')

          source = replace_once(source,
              'void FinalizeRecording(fs::path outputFile, std::wstring startedAt, std::wstring endedAt,\n'
              '                       StudentSession student) {',
              'void FinalizeRecording(fs::path outputFile, std::wstring startedAt, std::wstring endedAt,\n'
              '                       std::wstring recordingTitle, StudentSession student) {',
              'finalize signature')

          source = replace_once(source,
              '    if (ok) ok = UploadVideo(outputFile, startedAt, endedAt, student, error);',
              '    if (ok) ok = UploadVideo(outputFile, startedAt, endedAt, recordingTitle, student, error);',
              'finalize upload')

          source = replace_once(source,
              'void StartRecording() {',
              'void StartRecording(const std::wstring& recordingTitle) {',
              'start signature')

          source = replace_once(source,
              '    g_startedAt = TimestampIso();\n'
              '    g_recordingStudent = student;',
              '    g_startedAt = TimestampIso();\n'
              '    g_recordingTitle = recordingTitle;\n'
              '    g_recordingStudent = student;',
              'store recording title')

          source = replace_once(source,
              '        g_captureThread = std::thread(CaptureLoop, student);',
              '        g_captureThread = std::thread(CaptureLoop, student, recordingTitle);',
              'capture thread title')

          source = replace_once(source,
              '    Notify(L"ScanDisplay", L"Запись экрана начата. Интервал кадров: " +\n'
              '        std::to_wstring(g_config.captureIntervalSeconds) + L" сек.");',
              '    Notify(L"ScanDisplay", L"Запись начата: " + recordingTitle + L". Интервал кадров: " +\n'
              '        std::to_wstring(g_config.captureIntervalSeconds) + L" сек.");',
              'start notification')

          source = replace_once(source,
              '    g_finalizeThread = std::thread(FinalizeRecording, g_outputFile, g_startedAt, endedAt, g_recordingStudent);',
              '    g_finalizeThread = std::thread(FinalizeRecording, g_outputFile, g_startedAt, endedAt,\n'
              '        g_recordingTitle, g_recordingStudent);',
              'finalize thread title')

          title_window_code = r'''
void OpenRecordingTitleWindow() {
    if (g_state.load() != AppState::Idle) return;

    StudentSession student;
    {
        std::lock_guard<std::mutex> lock(g_studentMutex);
        student = g_student;
    }
    if (!student.authorized()) {
        MessageBoxW(g_mainWindow, L"Сначала выполните авторизацию по цифровому коду студента.",
            L"ScanDisplay", MB_ICONWARNING);
        return;
    }

    if (g_recordingTitleWindow && IsWindow(g_recordingTitleWindow)) {
        ShowWindow(g_recordingTitleWindow, SW_RESTORE);
        SetForegroundWindow(g_recordingTitleWindow);
        return;
    }

    g_recordingTitleWindow = CreateWindowExW(WS_EX_DLGMODALFRAME, kRecordingTitleWindowClass,
        L"Новая запись ScanDisplay", WS_OVERLAPPED | WS_CAPTION | WS_SYSMENU,
        CW_USEDEFAULT, CW_USEDEFAULT, 540, 235, g_mainWindow, nullptr, g_instance, nullptr);
    ShowWindow(g_recordingTitleWindow, SW_SHOW);
    UpdateWindow(g_recordingTitleWindow);
}

LRESULT CALLBACK RecordingTitleWindowProc(HWND window, UINT message, WPARAM wParam, LPARAM lParam) {
    switch (message) {
        case WM_CREATE:
            CreateWindowW(L"STATIC", L"Введите название работы или задания:", WS_CHILD | WS_VISIBLE,
                24, 22, 470, 22, window, nullptr, g_instance, nullptr);
            g_recordingTitleEdit = CreateWindowExW(WS_EX_CLIENTEDGE, L"EDIT", L"",
                WS_CHILD | WS_VISIBLE | WS_TABSTOP | ES_AUTOHSCROLL,
                24, 52, 470, 30, window,
                reinterpret_cast<HMENU>(static_cast<INT_PTR>(kRecordingTitleEditId)), g_instance, nullptr);
            CreateWindowW(L"BUTTON", L"Начать запись",
                WS_CHILD | WS_VISIBLE | WS_TABSTOP | BS_DEFPUSHBUTTON,
                24, 96, 190, 34, window,
                reinterpret_cast<HMENU>(static_cast<INT_PTR>(kRecordingTitleButtonId)), g_instance, nullptr);
            g_recordingTitleStatus = CreateWindowW(L"STATIC", L"Название будет сохранено вместе с видео.",
                WS_CHILD | WS_VISIBLE, 24, 142, 470, 42, window, nullptr, g_instance, nullptr);
            SendMessageW(g_recordingTitleEdit, EM_SETLIMITTEXT, 255, 0);
            SetFocus(g_recordingTitleEdit);
            return 0;

        case WM_COMMAND:
            if (LOWORD(wParam) == kRecordingTitleButtonId) {
                wchar_t buffer[256]{};
                GetWindowTextW(g_recordingTitleEdit, buffer, _countof(buffer));
                const std::wstring recordingTitle = TrimText(buffer);
                if (recordingTitle.empty()) {
                    SetWindowTextW(g_recordingTitleStatus, L"Введите название записи.");
                    SetFocus(g_recordingTitleEdit);
                    return 0;
                }

                DestroyWindow(window);
                StartRecording(recordingTitle);
                return 0;
            }
            break;

        case WM_CLOSE:
            DestroyWindow(window);
            return 0;

        case WM_DESTROY:
            g_recordingTitleWindow = nullptr;
            g_recordingTitleEdit = nullptr;
            g_recordingTitleStatus = nullptr;
            return 0;
    }
    return DefWindowProcW(window, message, wParam, lParam);
}

'''
          source = replace_once(source,
              'LRESULT CALLBACK MainWindowProc(HWND window, UINT message, WPARAM wParam, LPARAM lParam) {',
              title_window_code + 'LRESULT CALLBACK MainWindowProc(HWND window, UINT message, WPARAM wParam, LPARAM lParam) {',
              'title window implementation')

          source = replace_once(source,
              '                case kMenuStart: StartRecording(); return 0;',
              '                case kMenuStart: OpenRecordingTitleWindow(); return 0;',
              'start menu')

          source = replace_once(source,
              '    WNDCLASSEXW authClass = mainClass;\n'
              '    authClass.lpfnWndProc = AuthWindowProc;\n'
              '    authClass.lpszClassName = kAuthWindowClass;\n'
              '    authClass.hbrBackground = reinterpret_cast<HBRUSH>(COLOR_WINDOW + 1);\n'
              '    return RegisterClassExW(&mainClass) != 0 && RegisterClassExW(&authClass) != 0;',
              '    WNDCLASSEXW authClass = mainClass;\n'
              '    authClass.lpfnWndProc = AuthWindowProc;\n'
              '    authClass.lpszClassName = kAuthWindowClass;\n'
              '    authClass.hbrBackground = reinterpret_cast<HBRUSH>(COLOR_WINDOW + 1);\n\n'
              '    WNDCLASSEXW titleClass = mainClass;\n'
              '    titleClass.lpfnWndProc = RecordingTitleWindowProc;\n'
              '    titleClass.lpszClassName = kRecordingTitleWindowClass;\n'
              '    titleClass.hbrBackground = reinterpret_cast<HBRUSH>(COLOR_WINDOW + 1);\n\n'
              '    return RegisterClassExW(&mainClass) != 0 && RegisterClassExW(&authClass) != 0 &&\n'
              '        RegisterClassExW(&titleClass) != 0;',
              'register title window')

          main_path.write_text(source, encoding='utf-8')

          # ------------------------------------------------------------------
          # Server schema migration helper
          # ------------------------------------------------------------------
          bootstrap_path = Path('server/bootstrap.php')
          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          migration_code = r'''
function ensure_recordings_title_column(): void
{
    static $done = false;
    if ($done) return;

    $pdo = db();
    $driver = $pdo->getAttribute(PDO::ATTR_DRIVER_NAME);
    if ($driver === 'sqlite') {
        $columns = $pdo->query('PRAGMA table_info(recordings)')->fetchAll();
        $hasTitle = false;
        foreach ($columns as $column) {
            if (($column['name'] ?? '') === 'title') {
                $hasTitle = true;
                break;
            }
        }
        if (!$hasTitle) {
            $pdo->exec("ALTER TABLE recordings ADD COLUMN title TEXT NOT NULL DEFAULT 'Без названия'");
        }
    } else {
        $stmt = $pdo->query("SHOW COLUMNS FROM recordings LIKE 'title'");
        if (!$stmt->fetch()) {
            $pdo->exec("ALTER TABLE recordings ADD COLUMN title VARCHAR(255) NOT NULL DEFAULT 'Без названия' AFTER student_id");
        }
    }

    $done = true;
}

'''
          bootstrap = replace_once(bootstrap,
              'function h(?string $value): string\n{',
              migration_code + 'function h(?string $value): string\n{',
              'schema migration helper')
          bootstrap_path.write_text(bootstrap, encoding='utf-8')

          # ------------------------------------------------------------------
          # Installer schema
          # ------------------------------------------------------------------
          install_path = Path('server/install.php')
          install = install_path.read_text(encoding='utf-8')
          install = replace_once(install,
              '                        student_id BIGINT UNSIGNED NOT NULL,\n'
              '                        file_path VARCHAR(1024) NOT NULL,',
              '                        student_id BIGINT UNSIGNED NOT NULL,\n'
              '                        title VARCHAR(255) NOT NULL,\n'
              '                        file_path VARCHAR(1024) NOT NULL,',
              'mysql title column')
          install = replace_once(install,
              '                        student_id INTEGER NOT NULL,\n'
              '                        file_path TEXT NOT NULL,',
              '                        student_id INTEGER NOT NULL,\n'
              '                        title TEXT NOT NULL,\n'
              '                        file_path TEXT NOT NULL,',
              'sqlite title column')
          install_path.write_text(install, encoding='utf-8')

          # ------------------------------------------------------------------
          # Upload API
          # ------------------------------------------------------------------
          upload_path = Path('server/api/upload.php')
          upload = upload_path.read_text(encoding='utf-8')
          upload = replace_once(upload,
              "if (!is_installed()) {\n    json_response(['ok' => false, 'message' => 'Сервер не установлен.'], 503);\n}\n",
              "if (!is_installed()) {\n    json_response(['ok' => false, 'message' => 'Сервер не установлен.'], 503);\n}\nensure_recordings_title_column();\n",
              'upload migration call')
          upload = replace_once(upload,
              "$computerName = trim((string) ($_POST['computer_name'] ?? $session['authorized_computer']));",
              "$title = preg_replace('/\\s+/u', ' ', trim((string) ($_POST['title'] ?? ''))) ?? '';\n"
              "if ($title === '') {\n"
              "    json_response(['ok' => false, 'message' => 'Не указано название записи.'], 422);\n"
              "}\n"
              "$title = mb_substr($title, 0, 255);\n\n"
              "$computerName = trim((string) ($_POST['computer_name'] ?? $session['authorized_computer']));",
              'upload title validation')
          upload = replace_once(upload,
              "        'INSERT INTO recordings (student_id, file_path, original_name, file_size, started_at, ended_at, computer_name, created_at)\n"
              "         VALUES (?, ?, ?, ?, ?, ?, ?, ?)'",
              "        'INSERT INTO recordings (student_id, title, file_path, original_name, file_size, started_at, ended_at, computer_name, created_at)\n"
              "         VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)'",
              'upload insert sql')
          upload = replace_once(upload,
              '        $studentId,\n'
              '        $relativePath,',
              '        $studentId,\n'
              '        $title,\n'
              '        $relativePath,',
              'upload insert title value')
          upload_path.write_text(upload, encoding='utf-8')

          # ------------------------------------------------------------------
          # Admin UI and archive search
          # ------------------------------------------------------------------
          index_path = Path('server/index.php')
          index = index_path.read_text(encoding='utf-8')
          index = replace_once(index,
              "if (!is_installed()) {\n    header('Location: install.php');\n    exit;\n}\n\n$pdo = db();",
              "if (!is_installed()) {\n    header('Location: install.php');\n    exit;\n}\nensure_recordings_title_column();\n\n$pdo = db();",
              'index migration call')
          index = replace_once(index,
              "$dateFrom = trim((string) ($_GET['date_from'] ?? ''));\n$dateTo = trim((string) ($_GET['date_to'] ?? ''));",
              "$titleQuery = mb_substr(trim((string) ($_GET['title'] ?? '')), 0, 255);\n"
              "$dateFrom = trim((string) ($_GET['date_from'] ?? ''));\n"
              "$dateTo = trim((string) ($_GET['date_to'] ?? ''));",
              'title filter variable')
          index = replace_once(index,
              "    if ($selectedStudent > 0) { $where[] = 'r.student_id = ?'; $params[] = $selectedStudent; }\n"
              "    if ($dateFrom !== '') {",
              "    if ($selectedStudent > 0) { $where[] = 'r.student_id = ?'; $params[] = $selectedStudent; }\n"
              "    if ($titleQuery !== '') { $where[] = 'r.title LIKE ?'; $params[] = '%' . $titleQuery . '%'; }\n"
              "    if ($dateFrom !== '') {",
              'title filter sql')
          index = replace_once(index,
              '<thead><tr><th>Дата</th><th>Группа</th><th>Студент</th><th>Компьютер</th><th>Размер</th><th></th></tr></thead>',
              '<thead><tr><th>Дата</th><th>Название</th><th>Группа</th><th>Студент</th><th>Компьютер</th><th>Размер</th><th></th></tr></thead>',
              'dashboard title heading')
          index = replace_once(index,
              '                        <td><?= h($record[\'created_at\']) ?></td>\n'
              '                        <td><?= h($record[\'group_name\']) ?></td>',
              '                        <td><?= h($record[\'created_at\']) ?></td>\n'
              '                        <td><strong><?= h($record[\'title\']) ?></strong></td>\n'
              '                        <td><?= h($record[\'group_name\']) ?></td>',
