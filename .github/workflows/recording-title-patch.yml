              'recording card title')
          index_path.write_text(index, encoding='utf-8')

          # ------------------------------------------------------------------
          # Stream/download filename
          # ------------------------------------------------------------------
          stream_path = Path('server/stream.php')
          stream = stream_path.read_text(encoding='utf-8')
          stream = replace_once(stream,
              "require_admin();\n\n$id =",
              "require_admin();\nensure_recordings_title_column();\n\n$id =",
              'stream migration call')
          stream = replace_once(stream,
              "$stmt = db()->prepare('SELECT id, file_path, original_name FROM recordings WHERE id = ?');",
              "$stmt = db()->prepare('SELECT id, title, file_path, original_name FROM recordings WHERE id = ?');",
              'stream title query')
          stream = replace_once(stream,
              "$downloadName = preg_replace('/[^\\pL\\pN._-]+/u', '_', (string) $recording['original_name']) ?: 'recording.mp4';",
              "$sourceName = $download ? ((string) $recording['title'] . '.mp4') : (string) $recording['original_name'];\n"
              "$downloadName = preg_replace('/[^\\pL\\pN._-]+/u', '_', $sourceName) ?: 'recording.mp4';",
              'download filename')
          stream_path.write_text(stream, encoding='utf-8')

          # ------------------------------------------------------------------
          # README
          # ------------------------------------------------------------------
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '2. Выберите **Начать запись**.\n3. Работайте за компьютером.',
              '2. Выберите **Начать запись**.\n3. Введите обязательное название работы или задания и нажмите **Начать запись**.\n4. Работайте за компьютером.')
          readme = readme.replace(
              '3. Работайте за компьютером.\n4. Программа будет получать новый кадр',
              '4. Работайте за компьютером.\n5. Программа будет получать новый кадр')
          readme = readme.replace(
              '5. В верхней части каждого кадра будут записаны:',
              '6. В верхней части каждого кадра будут записаны:\n   - название записи;')
          readme = readme.replace(
              '6. Для завершения нажмите **Остановить запись**.',
              '7. Для завершения нажмите **Остановить запись**.')
          readme = readme.replace(
              'started_at\nended_at\ncomputer_name\nvideo',
              'title\nstarted_at\nended_at\ncomputer_name\nvideo')
          readme = readme.replace(
              'Там можно:\n\n- отфильтровать записи по группе;',
              'Там можно:\n\n- искать записи по введённому студентом названию;\n- отфильтровать записи по группе;')
          readme_path.write_text(readme, encoding='utf-8')

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find server -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/main.cpp server/bootstrap.php server/install.php server/api/upload.php server/index.php server/stream.php README.md
          git commit -m "Add student-defined recording titles"
          git push origin main

  windows-client:
    needs: patch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure
        run: cmake -S client -B client/build -A x64
      - name: Build
        run: cmake --build client/build --config Release --parallel

  cleanup:
    needs: windows-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/recording-title-patch.yml .github/recording-title-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete recording title implementation"
          git push origin main
