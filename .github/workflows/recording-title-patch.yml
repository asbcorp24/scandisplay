name: Add recording titles

on:
  push:
    branches: [main]
    paths:
      - .github/recording-title-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Implement recording titles
        run: python .github/scripts/add_recording_titles.py
      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find server -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/main.cpp server/bootstrap.php server/install.php server/api/upload.php server/index.php server/stream.php README.md
          git commit -m "Add student-defined recording titles"
          git push origin main

  windows-client:
    needs: patch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure
        run: cmake -S client -B client/build -A x64
      - name: Build
        run: cmake --build client/build --config Release --parallel

  cleanup:
    needs: windows-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/recording-title-patch.yml .github/recording-title-trigger.txt .github/scripts/add_recording_titles.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete recording title implementation"
          git push origin main
