name: Apply minimal video size settings

on:
  push:
    branches: [main]
    paths:
      - .github/minimize-video-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Optimize video resolution and still-image encoding
        shell: python
        run: |
          from pathlib import Path

          main = Path('client/src/main.cpp')
          source = main.read_text(encoding='utf-8')

          replacements = [
              (
                  '    int captureIntervalSeconds = 30;\n    int videoCrf = 35;\n    std::wstring videoPreset = L"veryslow";',
                  '    int captureIntervalSeconds = 30;\n    int videoMaxWidth = 1280;\n    int videoCrf = 35;\n    std::wstring videoPreset = L"veryslow";'
              ),
              (
                  '    } catch (...) {\n        g_config.captureIntervalSeconds = 30;\n    }\n\n    try {\n        const int crf = std::stoi(ReadIni(configPath, L"recording", L"video_crf", L"35"));',
                  '    } catch (...) {\n        g_config.captureIntervalSeconds = 30;\n    }\n\n    try {\n        const int width = std::stoi(ReadIni(configPath, L"recording", L"video_max_width", L"1280"));\n        g_config.videoMaxWidth = width < 320 ? 320 : width;\n    } catch (...) {\n        g_config.videoMaxWidth = 1280;\n    }\n\n    try {\n        const int crf = std::stoi(ReadIni(configPath, L"recording", L"video_crf", L"35"));'
              ),
              (
                  '    std::wstringstream command;\n    command << L\'"\' << g_config.ffmpegPath << L"\\\" -y -hide_banner -loglevel error "\n            << L"-f rawvideo -pix_fmt bgr0 -video_size " << g_screenWidth << L"x" << g_screenHeight << L" "\n            << L"-framerate 1/" << g_config.captureIntervalSeconds\n            << L" -i pipe:0 -an -fps_mode passthrough -c:v libx264 -preset "\n            << g_config.videoPreset << L" -crf " << g_config.videoCrf << L" "\n            << L"-pix_fmt yuv420p -movflags +faststart \\\"" << outputFile.wstring() << L"\\\"";',
                  '    int outputWidth = g_screenWidth;\n    int outputHeight = g_screenHeight;\n    if (outputWidth > g_config.videoMaxWidth) {\n        outputWidth = g_config.videoMaxWidth;\n        outputHeight = static_cast<int>((static_cast<std::int64_t>(g_screenHeight) * outputWidth) / g_screenWidth);\n    }\n    outputWidth = max(2, outputWidth - (outputWidth % 2));\n    outputHeight = max(2, outputHeight - (outputHeight % 2));\n\n    std::wstringstream command;\n    command << L\'"\' << g_config.ffmpegPath << L"\\\" -y -hide_banner -loglevel error "\n            << L"-f rawvideo -pix_fmt bgr0 -video_size " << g_screenWidth << L"x" << g_screenHeight << L" "\n            << L"-framerate 1/" << g_config.captureIntervalSeconds\n            << L" -i pipe:0 -an -vf scale=" << outputWidth << L":" << outputHeight << L":flags=area "\n            << L"-fps_mode passthrough -c:v libx264 -preset " << g_config.videoPreset\n            << L" -tune stillimage -crf " << g_config.videoCrf << L" "\n            << L"-pix_fmt yuv420p -movflags +faststart \\\"" << outputFile.wstring() << L"\\\"";'
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected main.cpp fragment not found: {old[:180]!r}')
              source = source.replace(old, new, 1)

          main.write_text(source, encoding='utf-8')

          config = Path('client/config.example.ini')
          config_text = config.read_text(encoding='utf-8')
          old_config = 'capture_interval_seconds=30\nvideo_crf=35'
          new_config = 'capture_interval_seconds=30\nvideo_max_width=1280\nvideo_crf=35'
          if old_config not in config_text:
              raise SystemExit('Expected config.example.ini fragment not found')
          config.write_text(config_text.replace(old_config, new_config, 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')

          old_ini = 'capture_interval_seconds=30\nvideo_crf=35'
          new_ini = 'capture_interval_seconds=30\nvideo_max_width=1280\nvideo_crf=35'
          if old_ini not in text:
              raise SystemExit('Expected README config fragment not found')
          text = text.replace(old_ini, new_ini, 1)

          marker = '`video_crf` — степень сжатия H.264. Чем больше значение, тем меньше файл и ниже качество:'
          width_docs = ('`video_max_width` — максимальная ширина готового видео:\n\n'
                        '```ini\n'
                        'video_max_width=1280\n'
                        '```\n\n'
                        '- по умолчанию видео уменьшается максимум до ширины `1280` пикселей;\n'
                        '- пропорции сохраняются, маленькие экраны не увеличиваются;\n'
                        '- для ещё меньшего файла можно установить `960`;\n'
                        '- для более чёткого текста можно установить `1600` или `1920`;\n'
                        '- минимально допустимое значение — `320`.\n\n'
                        + marker)
          if marker not in text:
              raise SystemExit('Expected README video_crf marker not found')
          text = text.replace(marker, width_docs, 1)

          old_format = ('FFmpeg сохраняет только фактически снятые кадры и не создаёт искусственные 25 кадров/с. Временные метки каждого кадра сохраняются в MP4, поэтому длительность видео соответствует реальной длительности записи. Кодирование H.264 выполняется с высоким сжатием, без звука и без лишних дублированных кадров.')
          new_format = ('FFmpeg сохраняет только фактически снятые кадры и не создаёт искусственные 25 кадров/с. Временные метки каждого кадра сохраняются в MP4, поэтому длительность видео соответствует реальной длительности записи. Перед кодированием изображение при необходимости уменьшается до `video_max_width`. Кодирование H.264 выполняется с высоким сжатием, настройкой `stillimage`, без звука и без лишних дублированных кадров.')
          if old_format not in text:
              raise SystemExit('Expected README format paragraph not found')
          text = text.replace(old_format, new_format, 1)

          readme.write_text(text, encoding='utf-8')

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/main.cpp client/config.example.ini README.md
          git commit -m "Reduce video resolution for smaller files"
          git push origin main
