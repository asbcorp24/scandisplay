name: Publish ScanDisplay Windows executable

on:
  push:
    branches: [main]
    paths:
      - .github/publish-exe-trigger.txt

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure client
        run: cmake -S client -B client/build -A x64

      - name: Build Release client
        run: cmake --build client/build --config Release --parallel

      - name: Commit executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item client/build/Release/ScanDisplay.exe release/ScanDisplay.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/ScanDisplay.exe
          git commit -m "Publish latest ScanDisplay Windows executable"
          git push origin main

  cleanup:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove publishing workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-windows-exe.yml .github/publish-exe-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Windows executable publishing"
          git push origin main
